<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vetri Music</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-music"></i>
            </div>

            <span>Vetri Music</span>
        </div>


        <nav class="main-nav">

            <button class="nav-btn active" data-page="home">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </button>

            <button class="nav-btn" data-page="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Search</span>
            </button>

            <button class="nav-btn" data-page="library">
                <i class="fa-solid fa-book"></i>
                <span>Your Library</span>
            </button>

        </nav>


        <div class="library-title">

            <span>Your Library</span>

            <button id="addPlaylist">
                <i class="fa-solid fa-plus"></i>
            </button>

        </div>


        <div class="playlist-box">

            <div class="playlist-icon">
                <i class="fa-solid fa-heart"></i>
            </div>

            <div>
                <h4>Liked Songs</h4>
                <p>Your favourite songs</p>
            </div>

        </div>


        <div class="playlist-box">

            <div class="playlist-icon purple">
                <i class="fa-solid fa-music"></i>
            </div>

            <div>
                <h4>My Playlist</h4>
                <p>Created by you</p>
            </div>

        </div>


        <div class="sidebar-bottom">

            <a href="#">Legal</a>
            <a href="#">Privacy</a>
            <a href="#">Cookies</a>

            <button class="language">
                <i class="fa-solid fa-globe"></i>
                English
            </button>

        </div>

    </aside>



    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <header class="topbar">

            <div class="navigation-buttons">

                <button id="backBtn">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>

                <button id="forwardBtn">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

            </div>


            <div class="search-area">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="What do you want to play?"
                >

            </div>


            <div class="account">

                <button class="premium">
                    Premium
                </button>

                <button class="install">
                    <i class="fa-solid fa-download"></i>
                    Install App
                </button>

                <button class="signup">
                    Sign up
                </button>

                <button class="login">
                    Log in
                </button>

            </div>

        </header>



        <!-- CONTENT -->
        <section class="content" id="content">

            <!-- HOME PAGE WILL LOAD HERE -->

        </section>

    </main>

</div>



<!-- MUSIC PLAYER -->

<footer class="player">

    <div class="current-song">

        <img
            id="playerImage"
            src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=150&q=80"
        >

        <div>

            <h4 id="playerTitle">
                Select a song
            </h4>

            <p id="playerArtist">
                Vetri Music
            </p>

        </div>

        <button id="likeSong">
            <i class="fa-regular fa-heart"></i>
        </button>

    </div>


    <div class="player-center">

        <div class="player-buttons">

            <button>
                <i class="fa-solid fa-shuffle"></i>
            </button>

            <button id="previousBtn">
                <i class="fa-solid fa-backward-step"></i>
            </button>

            <button class="play-main" id="playPause">

                <i class="fa-solid fa-play"></i>

            </button>

            <button id="nextBtn">
                <i class="fa-solid fa-forward-step"></i>
            </button>

            <button>
                <i class="fa-solid fa-repeat"></i>
            </button>

        </div>


        <div class="progress-area">

            <span id="currentTime">
                0:00
            </span>

            <input
                type="range"
                id="progress"
                value="0"
                min="0"
                max="100"
            >

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <div class="player-right">

        <i class="fa-solid fa-volume-high"></i>

        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="0.7"
        >

    </div>

</footer>


<script src="script.js"></script>

</body>
</html>
